{{- $bvid := .Get "bvid" | default (.Get 0) -}}
<div class="responsive-embed media-embed--wide">
  <iframe
    src="https://player.bilibili.com/player.html?bvid={{ $bvid }}&page=1&as_wide=1&high_quality=1&danmaku=1&autoplay=0"
    title="Bilibili video"
    scrolling="no"
    allowfullscreen>
  </iframe>
</div>
