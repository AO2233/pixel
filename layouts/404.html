<!DOCTYPE html>
<html lang="{{ site.Params.htmlLang | default "zh-CN" }}">
  {{- partial "head.html" . }}
  <body>
    <div class="crt-overlay" aria-hidden="true"></div>
    <main class="content error-page">
      <p class="error-label">NOT FOUND</p>
      <h1 class="error-code">404</h1>
      <p>This page slipped out of the story.</p>
      <a class="error-return keycap keycap--accent" href="{{ site.Home.RelPermalink }}">← BACK TO INDEX</a>
      <img src="{{ "404/no-data.png" | relURL }}" alt="Page not found">
    </main>
  </body>
</html>
