{{ define "main" }}
<main>
  <div class="title post-header">
    <h1 class="title">{{ .Title }}</h1>
    <div class="meta">Posted on <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ if .Draft }} <span class="draft-label">DRAFT</span>{{ end }}</div>
  </div>
  <div class="post-layout post-layout--with-toc">
    <aside class="post-toc post-toc--desktop" aria-label="Table of contents" hidden>
      <div class="post-toc-card">
        <div class="post-toc-header">
          <span class="post-toc-label">INDEX</span>
        </div>
        <nav>
          <ul class="post-toc-list"></ul>
        </nav>
        <span class="post-toc-resize-handle" aria-hidden="true"></span>
      </div>
    </aside>
    <section class="body">
      <article>
        {{ .Content }}
      </article>
    </section>
  </div>
</main>
{{ end }}
