{{ define "main" }}
<main class="log-page">
  <header class="post-header">
    <h1 class="title">{{ .Title }}</h1>
    <div class="meta">Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "2006.01.02" }}</time></div>
  </header>
  <section class="body">
    <article>
      {{ .Content }}
    </article>
  </section>
</main>
{{ end }}
